<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Armador de Horarios</title>
  <meta name="description" content="Arma tu horario Uniandes desde el pénsum visual de Ingeniería Mecánica, Física o Ingeniería Civil: magistrales, complementarias, choques y generador de combinaciones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/fa/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<!--APP-->
<div id="app" class="app">
  <aside id="rail" class="rail" aria-label="Navegación"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <main id="views" class="views">
      <section id="view-pensum" class="view view-scroll" hidden></section>
      <section id="view-horario" class="view view-horario" hidden></section>
      <section id="view-amigos" class="view view-scroll" hidden></section>
      <section id="view-exportar" class="view view-scroll" hidden></section>
    </main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
</div>
<div id="layer"></div>
<dialog id="dlg" class="dlg"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<!--/APP-->
<script src="assets/app.js"></script>
</body>
</html>
